name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -e '.[test]'
      - name: Python tests
        run: pytest -q
      - name: Check desktop JavaScript
        run: node --check macos/desktop/app.js
      - name: Install Playwright
        run: npm i --no-save playwright@1 && npx playwright install chromium
      - name: Desktop UI tests
        run: NODE_PATH=$PWD/node_modules node tests/desktop-ui.cjs
